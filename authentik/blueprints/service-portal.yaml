# Blueprint Authentik — Service Portal
# Aplicado automaticamente pelo authentik-worker na inicialização.
# Em instalações existentes (pg_data já presente), acesse o admin e re-aplique:
#   Admin → System → Blueprints → service-portal → Apply
#
# Cria:
#   - Scope mapping "groups" (inclui grupos do usuário no JWT do SPA)
#   - Scope mapping M2M admin (token client_credentials sempre recebe ADMIN)
#   - OAuth2 Provider SPA (PKCE, público) + Aplicação
#   - OAuth2 Provider M2M (client_credentials, confidencial) + Aplicação
#   - Grupos: ADMIN, RULES, WORKFLOWS
#   - Usuários: testuser (sem grupo), it (ADMIN), bizop (RULES), workop (WORKFLOWS)
#
# Labels:
#   blueprints.goauthentik.io/instantiate: "true"  → aplica ao importar
#
# Referências de flows:
#   default-provider-authorization-implicit-consent — autoriza sem tela de consentimento
#   default-authentication-flow                     — autentica username+senha

version: 1
metadata:
  name: service-portal
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:

  # ─── 1. Scope Mapping — groups (SPA) ───────────────────────────────────────
  # Adicionado ao SPA provider. O claim "groups" carrega os grupos do usuário autenticado.
  # Ativado quando o client solicita o scope "groups" (adicionado ao BFF via bff.auth.scopes).
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: service-portal-groups
    attrs:
      name: service-portal-groups
      scope_name: groups
      description: Inclui grupos do usuário no JWT (claim groups=[...])
      expression: |
        return {
          "groups": [group.name for group in request.user.ak_groups.all()]
        }

  # ─── 2. Scope Mapping — M2M admin (client_credentials) ────────────────────
  # Adicionado ao M2M provider. Tokens de serviço sempre recebem groups=["ADMIN"],
  # permitindo que o script de testes integrados acesse todos os endpoints do BFF.
  # scope_name vazio → sempre incluído, independente dos scopes requisitados.
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: service-portal-m2m-admin
    attrs:
      name: service-portal-m2m-admin
      scope_name: openid
      description: Concede ADMIN aos tokens M2M (service account) — ativado com scope openid
      expression: |
        return {
          "groups": ["ADMIN"]
        }

  # ─── 3. OAuth2 Provider SPA (público — PKCE, sem client_secret) ────────────
  # property_mappings: standard openid/profile/email + groups claim.
  # A ordem importa: scope mappings acima devem ser declarados antes deste entry.
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      client_id: !Env [AUTHENTIK_CLIENT_ID, service-portal-spa]
    attrs:
      name: service-portal-spa
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: !Env [AUTHENTIK_CLIENT_ID, service-portal-spa]
      # signing_key OBRIGATÓRIO: sem ele o Authentik assina os JWT com HS256
      # (simétrico) e o endpoint JWKS fica vazio → o BFF (Resource Server,
      # valida via JWKS/RS256) rejeita o token com "Another algorithm expected".
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - url: "http://localhost:5173/auth/callback"
          matching_mode: strict
        - url: "http://localhost/auth/callback"
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, service-portal-groups]]

  # ─── 4. Aplicação SPA ──────────────────────────────────────────────────────
  - model: authentik_core.application
    state: present
    identifiers:
      slug: !Env [AUTHENTIK_APP_SLUG, service-portal]
    attrs:
      name: Service Portal
      slug: !Env [AUTHENTIK_APP_SLUG, service-portal]
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, service-portal-spa]]

  # ─── 5. OAuth2 Provider M2M (confidencial — client_credentials) ────────────
  # property_mappings inclui o mapeamento estático de grupos (service-portal-m2m-admin).
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: service-portal-m2m
    attrs:
      name: service-portal-m2m
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: service-portal-m2m
      client_secret: !Env [AUTHENTIK_M2M_SECRET, service-portal-m2m-secret]
      # signing_key OBRIGATÓRIO (RS256 + JWKS) — ver nota no provider SPA.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris: []
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_token_validity: hours=1
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, service-portal-m2m-admin]]

  # ─── 6. Aplicação M2M ──────────────────────────────────────────────────────
  - model: authentik_core.application
    state: present
    identifiers:
      slug: service-portal-m2m
    attrs:
      name: Service Portal M2M
      slug: service-portal-m2m
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, service-portal-m2m]]

  # ─── 7. Grupo ADMIN ────────────────────────────────────────────────────────
  # Acesso a todos os módulos.
  - model: authentik_core.group
    state: present
    identifiers:
      name: ADMIN
    attrs:
      name: ADMIN

  # ─── 8. Grupo RULES ────────────────────────────────────────────────────────
  # Acesso ao módulo de regras (future feature).
  - model: authentik_core.group
    state: present
    identifiers:
      name: RULES
    attrs:
      name: RULES

  # ─── 9. Grupo WORKFLOWS ────────────────────────────────────────────────────
  # Acesso ao módulo de workflows (flow-manager).
  - model: authentik_core.group
    state: present
    identifiers:
      name: WORKFLOWS
    attrs:
      name: WORKFLOWS

  # ─── 10. Usuário de teste (sem grupo — acesso básico) ──────────────────────
  # Pode fazer login mas não acessa endpoints de flows/executions (403).
  - model: authentik_core.user
    state: present
    identifiers:
      username: testuser
    attrs:
      username: testuser
      email: testuser@sp.local
      name: Test User
      is_active: true
      password: !Env [AUTHENTIK_TEST_PASSWORD, testpass123]

  # ─── 11. Usuário it (grupo ADMIN) ──────────────────────────────────────────
  - model: authentik_core.user
    state: present
    identifiers:
      username: it
    attrs:
      username: it
      email: it@sp.local
      name: IT Admin
      is_active: true
      password: itadmin
      groups:
        - !Find [authentik_core.group, [name, ADMIN]]

  # ─── 12. Usuário bizop (grupo RULES) ───────────────────────────────────────
  - model: authentik_core.user
    state: present
    identifiers:
      username: bizop
    attrs:
      username: bizop
      email: bizop@sp.local
      name: Business Operations
      is_active: true
      password: bizoppass
      groups:
        - !Find [authentik_core.group, [name, RULES]]

  # ─── 13. Usuário workop (grupo WORKFLOWS) ──────────────────────────────────
  - model: authentik_core.user
    state: present
    identifiers:
      username: workop
    attrs:
      username: workop
      email: workop@sp.local
      name: Workflow Operations
      is_active: true
      password: workoppass
      groups:
        - !Find [authentik_core.group, [name, WORKFLOWS]]

  # ─── 14. Flow de login do BFF (service-portal-ropc) ────────────────────────
  # O BFF (AuthentikLoginService) autentica usuário/senha server-side via
  # Flow Executor neste slug. Sequência: identification → password → user-login
  # (SEM MFA — o fluxo programático não resolve desafios de TOTP/WebAuthn).
  # Reaproveita os 3 stages default do Authentik via bindings abaixo.
  - model: authentik_flows.flow
    state: present
    identifiers:
      slug: service-portal-ropc
    attrs:
      name: Service Portal ROPC
      title: Service Portal Login
      slug: service-portal-ropc
      designation: authentication
      authentication: require_unauthenticated

  # ─── 15. Binding: identification stage (order 10) ──────────────────────────
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, service-portal-ropc]]
      stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # ─── 16. Binding: password stage (order 20) ────────────────────────────────
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, service-portal-ropc]]
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # ─── 17. Binding: user-login stage (order 30 — sem MFA) ────────────────────
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, service-portal-ropc]]
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
