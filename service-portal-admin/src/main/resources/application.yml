spring:
  application:
    name: service-portal-admin
  security:
    # Dev defaults only: SecurityDefaultsGuard warns, and fails startup with profile prod or strict=true.
    user:
      name: ${SBA_USERNAME:admin}
      password: ${SBA_PASSWORD:admin}
  boot:
    admin:
      ui:
        title: "Service Portal Admin"

sba:
  security:
    strict: ${SECURITY_STRICT:false}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
