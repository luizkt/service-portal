spring:
  application:
    name: service-portal-admin
  security:
    user:
      name: ${SBA_USERNAME:admin}
      password: ${SBA_PASSWORD:admin}
  boot:
    admin:
      ui:
        title: "Service Portal Admin"

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
