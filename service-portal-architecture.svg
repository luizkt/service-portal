  <g transform="translate(60,1140)">
    <text x="0" y="14" font-size="12" fill="#475569">
      <tspan font-weight="700" fill="#334155">Fluxo numerado:</tspan>
      ① Usuário acessa SPA · ② SPA faz OAuth2/PKCE no Authentik · ③ SPA chama BFF com Bearer JWT · ④ BFF faz CRUD no Manager · ⑤ BFF dispara execução no Orquestrador · ⑥ Orquestrador busca YAML no Manager · ⑦ Orquestrador chama APIs externas.
    </text>
    <text x="0" y="40" font-size="12" fill="#475569">
      <tspan font-weight="700" fill="#334155">WireMock</tspan> representa serviços HTTP externos ainda desconhecidos — na rede Docker responde como
      <tspan font-family="ui-monospace, SFMono-Regular, monospace" fill="#0f172a">api.exemplo.com</tspan>, então a URL do workflow não muda entre dev e produção.
    </text>
    <text x="0" y="66" font-size="12" fill="#475569">
      Auth server-to-server (BFF→Manager, BFF→Orquestrador, Orquestrador→Manager) usa JWT HS512 com cache de token. Apenas o usuário final passa pelo Authentik via OAuth2/PKCE.
    </text>
  </g>
