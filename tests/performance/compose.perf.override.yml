# Override do compose para o benchmark de performance (v1 x v2 x v3).
#
# Eleva o slow-call-duration-threshold do circuit breaker do orquestrador de 800 ms
# (default) para 3000 ms. O stub do WireMock responde em ~500 ms; sob carga a latência
# passa de 800 ms, o breaker abre por 30 s e derruba os flows — o benchmark mediria o
# ajuste do breaker, não a concorrência. Propriedade original:
#   orch-integrations.circuit-breaker-configuration.slow-call-duration-threshold
# (relaxed binding do Spring Boot: sem hífens, maiúsculas, "." -> "_").
#
# Também reduz o log da aplicação de DEBUG para INFO: com DEBUG, cada passo gera várias linhas
# no console e, com virtual threads, a escrita do Logback (OutputStreamAppender.writeBytes)
# prende a carrier thread (jdk.VirtualThreadPinned medido no JFR: 184 eventos, 26 ms de
# mediana), o que mede o custo de log e não a concorrência.
#
# Aplicar:
#   docker compose -f docker-compose-service-portal.yml \
#     -f tests/performance/compose.perf.override.yml up -d --no-build orchestrator
# Remover (volta ao default 800 ms):
#   docker compose -f docker-compose-service-portal.yml up -d --no-build orchestrator
services:
  orchestrator:
    environment:
      ORCHINTEGRATIONS_CIRCUITBREAKERCONFIGURATION_SLOWCALLDURATIONTHRESHOLD: "3000"
      LOGGING_LEVEL_COM_ORCHESTRATOR: "INFO"
