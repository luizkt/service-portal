global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'generic-orchestrator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['orchestrator:8080']

  - job_name: 'service-portal-bff'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['bff:8081']

  - job_name: 'service-portal-manager'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['manager:8082']
