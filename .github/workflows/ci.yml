name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: admin build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service-portal-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, Spotless e testes (gradle build inclui test)
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

  # Roda em paralelo com o build: o Dockerfile compila dentro da imagem
  # (gradle bootJar), então não depende da saída do job admin.
  docker-build:
    name: admin docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: service-portal-admin
          push: false
          load: true
          tags: service-portal-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test da imagem
        run: |
          docker run -d --name admin -p 8085:8080 service-portal-admin:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8085/actuator/health && exit 0
            sleep 2
          done
          docker logs admin
          exit 1

  agents-index:
    name: índice AGENTS.md e script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: check do admin
        run: python3 scripts/repo-index.py check service-portal-admin
      - name: cópias do script iguais à fonte
        run: scripts/sync-skill-script.sh --verify

  open-pr:
    name: abrir PR para main
    needs: [admin, agents-index]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Abrir PR para main, se ainda não existir
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "PR já aberto para $BRANCH."
            exit 0
          fi
          title=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          {
            printf '%s\n\n' "PR aberto automaticamente pelo CI depois de build e testes verdes em \`$BRANCH\`."
            printf '%s\n\n' "Último commit:"
            printf '%s\n' "$COMMIT_MSG"
          } > body.md
          if ! gh pr create --base main --head "$BRANCH" --title "$title" --body-file body.md; then
            echo "::warning::Não foi possível abrir o PR. Verifique em Settings > Actions > General se 'Allow GitHub Actions to create and approve pull requests' está habilitado."
          fi
